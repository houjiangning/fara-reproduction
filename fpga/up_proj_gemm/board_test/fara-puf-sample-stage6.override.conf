#=============================================================================
# fara-puf-sample-stage6.override.conf
# systemd drop-in for fara-puf-sample.service -- Stage 6 re-verification
#
# NOTE: keep this file ASCII-only.
#
# WHY THIS EXISTS
#   fara-puf-sample.service appends ONE PUF sample to /opt/fara/puf/puf_samples.txt
#   at EVERY cold boot. That file IS the frozen 32-sample baseline dataset
#   (SHA256 CB790C38F3AD597BCC11CA0EDAF4DFA6579EB3AA93D39F82CB1A538311B2B607).
#   Stage 6 needs fresh samples from the REBUILT bitstream, so they must go to a
#   SEPARATE file -- otherwise the baseline gets polluted and the comparison
#   target is destroyed.
#
# MUST BE INSTALLED BEFORE THE FIRST REBOOT after deploying the Stage 6 bitstream.
#   Once the board boots with the old service config, one polluted line is already
#   in the baseline file.
#
# INSTALL (on the board):
#   sudo mkdir -p /etc/systemd/system/fara-puf-sample.service.d
#   sudo install -m0644 fara-puf-sample-stage6.override.conf \
#        /etc/systemd/system/fara-puf-sample.service.d/stage6-puf-log.conf
#   sudo systemctl daemon-reload
#   systemctl show fara-puf-sample.service -p Environment   # expect PUF_LOG=...
#
# sampler parameters are intentionally NOT overridden here so Stage 6 runs with
# the exact same operating point as the baseline: M_SAMP=9 T_FORCE=8 T_SETTLE=64.
#
# REVERT to the baseline path afterwards:
#   sudo rm /etc/systemd/system/fara-puf-sample.service.d/stage6-puf-log.conf
#   sudo systemctl daemon-reload
#=============================================================================
[Service]
Environment=PUF_LOG=/opt/fara/puf/puf_samples_stage6.txt
