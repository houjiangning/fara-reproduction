#=============================================================================
# fara-puf-sample-isolation.override.conf
# systemd drop-in for fara-puf-sample.service -- Stage 6 REVIEW triage (isolation)
#
# NOTE: keep this file ASCII-only.
#
# WHY THIS EXISTS
#   Stage 6 dynamic verification (rebuilt bitstream 12659FED) produced a PUF
#   stable-bit set that differs from the frozen baseline by ~48 of ~95 bits.
#   To isolate "physical change from re-implementation" (H1) from
#   "temperature/session drift" (H2), we reflash the ARCHIVED ORIGINAL
#   bitstream (538CB36E...) and run a FRESH 32-boot campaign. Those samples
#   must NOT touch either the baseline file or the Stage 6 file, so they go to
#   a THIRD file: /opt/fara/puf/puf_samples_isolation.txt
#
#   Sampler parameters are intentionally left at the operating point
#   (M_SAMP=9 T_FORCE=8 T_SETTLE=64), identical to the baseline and Stage 6 runs.
#
# INSTALL (on the board) -- remove any other drop-in so this one wins:
#   sudo rm -f /etc/systemd/system/fara-puf-sample.service.d/*.conf
#   sudo install -m0644 fara-puf-sample-isolation.override.conf \
#        /etc/systemd/system/fara-puf-sample.service.d/iso-puf-log.conf
#   sudo systemctl daemon-reload
#   systemctl show fara-puf-sample.service -p Environment   # expect isolation path
#=============================================================================
[Service]
Environment=PUF_LOG=/opt/fara/puf/puf_samples_isolation.txt
